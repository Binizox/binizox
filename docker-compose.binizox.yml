services:
  api:
    environment:
      BINIZOX_TOOL_RUNNER_URL: http://binizox-tool-runner:8091
      BINIZOX_PARSER_URL: http://binizox-parser:8090
      NO_PROXY: localhost,127.0.0.1,postgres,redis,minio,binizox-parser,binizox-tool-runner
      no_proxy: localhost,127.0.0.1,postgres,redis,minio,binizox-parser,binizox-tool-runner
    depends_on:
      binizox-parser:
        condition: service_healthy
      binizox-tool-runner:
        condition: service_healthy

  worker:
    environment:
      BINIZOX_TOOL_RUNNER_URL: http://binizox-tool-runner:8091
      BINIZOX_PARSER_URL: http://binizox-parser:8090
      NO_PROXY: localhost,127.0.0.1,postgres,redis,minio,binizox-parser,binizox-tool-runner
      no_proxy: localhost,127.0.0.1,postgres,redis,minio,binizox-parser,binizox-tool-runner
    depends_on:
      binizox-parser:
        condition: service_healthy
      binizox-tool-runner:
        condition: service_healthy

  binizox-parser:
    build:
      context: ./services/parser-sidecar
      dockerfile: Dockerfile
    image: binizox-parser:0.1.0
    ports:
      - "127.0.0.1:${BINIZOX_PARSER_PORT:-8090}:8090"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  binizox-tool-runner:
    build:
      context: ./services/personal-tool-runner
      dockerfile: Dockerfile
    image: binizox-personal-tool-runner:0.1.0
    volumes:
      - ./.runtime/binizox/tool-runner:/data
      - ./.runtime/binizox/workspace:/workspace
    ports:
      - "127.0.0.1:${BINIZOX_TOOL_RUNNER_PORT:-8091}:8091"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
