services:
  # 显式启用 test profile 时运行，为 Evidence E2E 提供确定性模型响应。
  # Parser 与个人工具服务已进入默认、生产 Compose，此文件只保留测试扩展。
  binizox-evidence-replay:
    profiles: ["test"]
    image: ${COMPOSE_PROJECT_NAME:-binizox}-api:${BINIZOX_VERSION:-0.7.2}
    working_dir: /app
    user: "1000:1000"
    volumes:
      - ./backend/test:/app/test:ro
    command: python test/support/binizox_evidence_replay_server.py --host 0.0.0.0 --port 8767
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8767/health').read()"]
      interval: 3s
      timeout: 2s
      retries: 20
