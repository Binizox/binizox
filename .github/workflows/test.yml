# 后端单元测试 CI：此前后端 pytest 从未接入 CI，改动回归无人把关。
# 本工作流在 push/PR 时运行 unit 层测试（不依赖 docker 服务）。
name: Backend Unit Tests

on:
  pull_request:
    paths:
      - '.env.template'
      - 'backend/**'
      - 'services/personal-tool-runner/**'
      - 'backend/pyproject.toml'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'Makefile'
      - 'scripts/init.sh'
      - 'scripts/init.ps1'
      - 'scripts/test_init_security.ps1'
      - 'scripts/migrate-binizox-local-state.ps1'
      - 'scripts/test_migrate_binizox_local_state.ps1'
      - 'scripts/migrate-storage.sh'
      - '.github/workflows/test.yml'
  push:
    branches:
      - main
    paths:
      - '.env.template'
      - 'backend/**'
      - 'services/personal-tool-runner/**'
      - 'backend/pyproject.toml'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'scripts/init.sh'
      - 'scripts/init.ps1'
      - 'scripts/test_init_security.ps1'
      - 'scripts/migrate-binizox-local-state.ps1'
      - 'scripts/test_migrate_binizox_local_state.ps1'
      - 'scripts/migrate-storage.sh'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.6"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --group test

      - name: Run complete unit inventory
        run: uv run pytest test/unit -m 'not slow' -q

  powershell-security-contract:
    name: PowerShell security environment contract
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run native PowerShell security negative controls
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test_init_security.ps1

      - name: Run local state migration contract
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test_migrate_binizox_local_state.ps1

  personal-tool-runner-tests:
    name: Personal Tool Runner unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install service test dependencies
        run: python -m pip install -e 'services/personal-tool-runner[dev]'
      - name: Run authentication, isolation and idempotency tests
        run: python -m pytest services/personal-tool-runner/test -q
