services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${BINIZOX_POSTGRES_USER:-binizox}
      POSTGRES_PASSWORD: ${BINIZOX_POSTGRES_PASSWORD:?请在本地环境文件设置 BINIZOX_POSTGRES_PASSWORD}
      POSTGRES_DB: ${BINIZOX_POSTGRES_DB:-binizox}
    ports:
      - "127.0.0.1:${BINIZOX_POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./.runtime/binizox/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BINIZOX_POSTGRES_USER:-binizox} -d ${BINIZOX_POSTGRES_DB:-binizox}"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4.10-alpine
    ports:
      - "127.0.0.1:${BINIZOX_REDIS_PORT:-56379}:6379"
    volumes:
      - ./.runtime/binizox/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: ${BINIZOX_MINIO_ACCESS_KEY:?请设置 BINIZOX_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${BINIZOX_MINIO_SECRET_KEY:?请设置 BINIZOX_MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:${BINIZOX_MINIO_PORT:-59000}:9000"
      - "127.0.0.1:${BINIZOX_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - ./.runtime/binizox/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
