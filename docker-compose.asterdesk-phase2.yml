services:
  api:
    volumes:
      - ../../examples/phase2:/workspace-examples:ro
    environment:
      ASTERDESK_PARSER_URL: http://asterdesk-parser:8090
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set phase2 JWT_SECRET_KEY}
      YUXI_INSTANCE_ID: ${YUXI_INSTANCE_ID:?Set phase2 YUXI_INSTANCE_ID}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set phase2 MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set phase2 MINIO_SECRET_KEY}
      NO_PROXY: localhost,127.0.0.1,postgres,redis,minio,sandbox-provisioner,asterdesk-parser
      no_proxy: localhost,127.0.0.1,postgres,redis,minio,sandbox-provisioner,asterdesk-parser
    depends_on:
      asterdesk-parser:
        condition: service_healthy

  worker:
    environment:
      ASTERDESK_PARSER_URL: http://asterdesk-parser:8090
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set phase2 JWT_SECRET_KEY}
      YUXI_INSTANCE_ID: ${YUXI_INSTANCE_ID:?Set phase2 YUXI_INSTANCE_ID}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set phase2 MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set phase2 MINIO_SECRET_KEY}
      NO_PROXY: localhost,127.0.0.1,postgres,redis,minio,sandbox-provisioner,asterdesk-parser
      no_proxy: localhost,127.0.0.1,postgres,redis,minio,sandbox-provisioner,asterdesk-parser
    depends_on:
      asterdesk-parser:
        condition: service_healthy

  storage-migrator:
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set phase2 JWT_SECRET_KEY}
      YUXI_INSTANCE_ID: ${YUXI_INSTANCE_ID:?Set phase2 YUXI_INSTANCE_ID}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set phase2 MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set phase2 MINIO_SECRET_KEY}

  asterdesk-parser:
    build:
      context: ../../services/parser-sidecar
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-asterdesk-phase2}-parser:0.1.0
    ports:
      - "127.0.0.1:${ASTERDESK_PARSER_PORT:-28090}:8090"
    networks:
      - app-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8090/health').read()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  asterdesk-replay:
    image: ${COMPOSE_PROJECT_NAME:-asterdesk-phase2}-api:${YUXI_VERSION:-0.7.2}
    working_dir: /app
    volumes:
      - ./backend/test:/app/test:ro
    command:
      - python
      - /app/test/support/asterdesk_evidence_replay_server.py
      - --host
      - 0.0.0.0
      - --port
      - "8767"
    networks:
      - app-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8767/health').read()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
