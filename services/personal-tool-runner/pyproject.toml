[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binizox-personal-tool-runner"
version = "0.1.0"
description = "Binizox 本地个人工具执行服务"
requires-python = ">=3.12,<3.14"
dependencies = [
    # 与 Yuxi 主工程对齐；parser sidecar 使用独立 Conda 环境保留其固定版本。
    "fastapi>=0.121,<1",
    "pydantic>=2.11,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "UP", "W"]
